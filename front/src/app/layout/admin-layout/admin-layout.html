<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="shell__sidenav">
    <div class="shell__brand">
      <mat-icon class="shell__brand-icon">insights</mat-icon>
      <span class="shell__brand-text">Foresite</span>
    </div>

    <mat-nav-list class="shell__nav">
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="shell__nav-item--active"
          class="shell__nav-item"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell__content">
    <mat-toolbar class="shell__topbar">
      <span class="shell__topbar-title">ReparaYa</span>

      <span class="shell__spacer"></span>

      <button type="button" mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Cuenta">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button type="button" mat-menu-item routerLink="/login">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="shell__main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
