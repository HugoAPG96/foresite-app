<div class="miembros">
  <header class="page-header">
    <div>
      <h1 class="page-header__title">Miembros</h1>
      <p class="page-header__subtitle">{{ miembros().length }} miembros en el proyecto</p>
    </div>
  </header>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }
  @if (error()) {
    <p style="color: var(--mat-sys-error);">{{ error() }}</p>
  }

  <div class="miembros__add">
    <mat-form-field appearance="outline">
      <mat-label>Correo del usuario a agregar</mat-label>
      <input matInput [ngModel]="nuevoEmail()" (ngModelChange)="nuevoEmail.set($event)" (keyup.enter)="agregar()" />
    </mat-form-field>
    <button type="button" mat-flat-button (click)="agregar()">Agregar</button>
  </div>

  <ul class="miembros__list">
    @for (m of miembros(); track m.id) {
      <li>
        <span>{{ m.usuario?.name ?? '(usuario eliminado)' }}</span>
        <span class="miembros__email">{{ m.usuario?.email }}</span>
      </li>
    }
  </ul>
</div>
