<div class="proyectos">
  <header class="page-header">
    <div>
      <h1 class="page-header__title">Mis Proyectos</h1>
      <p class="page-header__subtitle">{{ proyectos().length }} proyectos activos</p>
    </div>
    <button mat-flat-button type="button" routerLink="/proyecto/nuevo">
      <mat-icon>add</mat-icon>
      Nuevo proyecto
    </button>
  </header>

  <div class="proyectos__grid">
    @for (proyecto of proyectos(); track proyecto.nombre) {
      <a class="project-card" routerLink="/dashboard">
        <div class="project-card__header">
          <p class="project-card__name">{{ proyecto.nombre }}</p>
          <span class="badge" [class]="'badge--' + (proyecto.estado === 'verde' ? 'success' : 'warning')">
            {{ proyecto.estado === 'verde' ? 'En curso' : 'En riesgo' }}
          </span>
        </div>

        <p class="project-card__desc">{{ proyecto.descripcion }}</p>

        <div class="project-card__progress">
          <mat-progress-bar mode="determinate" [value]="proyecto.avance" />
          <span class="project-card__progress-value">{{ proyecto.avance }}%</span>
        </div>
      </a>
    }
  </div>
</div>
