<div class="perfil">
  <header class="page-header">
    <h1 class="page-header__title">Mi perfil</h1>
  </header>

  <mat-form-field appearance="outline">
    <mat-label>Correo</mat-label>
    <input matInput [value]="email()" disabled />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Nombre</mat-label>
    <input matInput [ngModel]="nombre()" (ngModelChange)="nombre.set($event)" />
  </mat-form-field>

  <button type="button" mat-flat-button [disabled]="guardando()" (click)="guardar()">Guardar</button>

  @if (guardado()) {
    <p>Cambios guardados.</p>
  }
</div>
